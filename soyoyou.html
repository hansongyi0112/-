  body::after{content:'';position:fixed;inset:0;z-index:0;
    background:linear-gradient(180deg,rgba(253,246,222,.80),rgba(253,246,222,.60) 45%,rgba(250,240,206,.78))}
  #grain{position:fixed;inset:0;pointer-events:none;z-index:1;opacity:.62;mix-blend-mode:multiply}
  /* 소용돌이 붓자국 */
  .swirl{position:fixed;pointer-events:none;z-index:0;opacity:.20}
  .swirl.s1{top:-140px;right:-160px;width:520px;animation:slowspin 90s linear infinite}
  .swirl.s2{bottom:-180px;left:-200px;width:600px;opacity:.15;animation:slowspin 120s linear infinite reverse}
  @keyframes slowspin{to{transform:rotate(360deg)}}
  .blob{position:fixed;border-radius:50%;filter:blur(60px);pointer-events:none;z-index:0;animation:drift 18s ease-in-out infinite alternate}
  .b1{width:340px;height:340px;background:rgba(232,169,60,.30);top:8%;left:-90px}
  .b2{width:300px;height:300px;background:rgba(46,78,158,.14);bottom:6%;right:-70px;animation-delay:4s}
  @keyframes drift{to{transform:translate(30px,-24px) scale(1.08)}}

  .wrap{width:min(640px,100%);padding:20px 20px 46px;position:relative;z-index:2;display:flex;flex-direction:column;min-height:100vh}

  header{padding:12px 4px 4px}
  .brand{display:flex;align-items:baseline;gap:12px}
  .brand b{font-family:var(--serif);font-size:1.85rem;font-weight:900;letter-spacing:.08em;color:var(--cobalt-dk);
    display:inline-block;transform:rotate(-1.5deg);position:relative;
    text-shadow:1.5px 1.5px 0 rgba(232,169,60,.55), 3px 3px 6px rgba(122,98,30,.18)}
  .brand b::after{content:'';position:absolute;left:-3%;right:-6%;bottom:3px;height:11px;z-index:-1;
    background:linear-gradient(90deg,rgba(232,169,60,.60),rgba(226,112,74,.28),rgba(232,169,60,.10));
    border-radius:8px 3px 9px 4px;transform:skewX(-14deg) rotate(-.6deg)}
  .brand span{font-family:var(--serif);font-size:.95rem;color:var(--cobalt-dk);letter-spacing:.2em;font-weight:800;text-shadow:1px 1px 0 rgba(255,252,235,.95)}
  #bloomBox{margin-top:10px;background:rgba(255,252,238,.55);border:1.5px solid var(--edge);
    border-radius:22px 26px 20px 28px;padding:8px 14px 4px;display:none;backdrop-filter:blur(2px)}
  #bloomLabel{font-size:.68rem;color:var(--ink-dim);letter-spacing:.14em;display:flex;justify-content:space-between;padding:2px 4px}
  #bloom{width:100%;height:150px;display:block}
  .tick{stroke:#DACBA0;stroke-width:3;stroke-linecap:round;transition:stroke .45s,stroke-width .45s}
  .tick.on{stroke:#B97F1C;stroke-width:5.5}

  main{flex:1;display:flex;flex-direction:column;justify-content:center;padding:16px 0}
  .screen{animation:rise .5s cubic-bezier(.22,.9,.3,1) both}
  .screen.leaving{animation:fall .28s ease both}
  @keyframes rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
  @keyframes fall{to{opacity:0;transform:translateY(-16px)}}

  .qnum{font-size:.72rem;letter-spacing:.22em;color:#7A5208;margin-bottom:12px;font-weight:800}
  h1{font-family:var(--serif);font-size:clamp(1.5rem,5.2vw,2.05rem);font-weight:800;letter-spacing:-.01em;line-height:1.42;word-break:keep-all;color:#2E2A20}
  h1 em{font-style:normal;color:var(--cobalt)}
  .sub{margin-top:10px;color:var(--ink-dim);font-size:.93rem;word-break:keep-all;font-weight:500}

  .body{margin-top:24px}

  input[type=text],input[type=date],input[type=time],textarea{
    width:100%;background:rgba(255,253,244,.9);border:1.5px solid var(--edge);color:var(--ink);
    border-radius:16px 18px 15px 19px;padding:15px 17px;font-size:1rem;font-family:inherit;outline:none;
    transition:border-color .2s, box-shadow .2s;
  }
  input:focus,textarea:focus{border-color:var(--cobalt);box-shadow:0 0 0 4px rgba(46,78,158,.13)}
  textarea{min-height:126px;resize:vertical;line-height:1.7}
  .stack>*+*{margin-top:12px}
  .lbl{display:block;font-size:.8rem;color:var(--ink-dim);margin:0 0 6px 4px}

  .chips{display:flex;flex-wrap:wrap;gap:10px}
  .chip{
    border:1.5px solid var(--edge);background:rgba(255,253,244,.9);color:var(--ink);
    padding:12px 17px;border-radius:999px;font-size:.94rem;cursor:pointer;user-select:none;
    transition:transform .12s,border-color .2s,background .2s,color .2s;position:relative;font-family:inherit;
  }
  .chip:active{transform:scale(.95)}
  .chip.sel{background:var(--cobalt);border-color:var(--cobalt-dk);color:#FFF9E8}
  .chip .ord{

<script>

/* ================= 문항 정의 ================= */

const Q=[

 {id:'temper3',type:'single',t:'큰 <em>변화</em> 앞에서 나는,',opts:['🏠 안정이 우선이다','🚪 새로움에 끌린다','😬 겁나지만 결국 해본다'],req:1},

 {id:'support',type:'textarea',t:'힘들 때 <em>기댈 수 있는</em> 사람이나 활동이 있나요?',s:'떠오르는 만큼만. 없다면 "없음"이라고 적어주셔도 됩니다.',opt:1},
 {id:'values',type:'rank',t:'삶에서 <em>중요한 것</em>, 순서대로 골라주세요',s:'중요한 순서대로 탭! 다시 누르면 취소됩니다. (3개 이상)',opts:VALUE_OPTS,req:1},
 {id:'wantArea',type:'chips',t:'이번 풀이에서 <em>들여다보고 싶은 영역</em>은?',s:'모두 골라주세요.',opts:['💼 일·커리어','💰 재물·투자 시기','💞 관계·인연','🌿 건강','📆 올해·내년의 흐름','🧭 큰 결정의 타이밍'],req:1},
 {id:'want',type:'textarea',t:'마지막으로, <em>꼭 답을 얻고 싶은 질문</em>을 적어주세요',s:'1~3가지. 이 질문이 풀이의 나침반이 됩니다.',ph:'예: 지금 하는 일을 계속 가져가는 게 맞을까요?',req:1},

/* ================= 상태 ================= */
var idx=-2, ans={}, agreed=false;
var stage=document.getElementById('stage');
var bloomBox=document.getElementById('bloomBox');

/* ================= 나침반 (좌표 직접 계산 — 모든 브라우저에서 확실히 그려짐) ================= */
function cpt(cx,cy,a,r){return [cx+Math.cos(a)*r, cy+Math.sin(a)*r];}
var ELEM=['#C6432E','#D9A62E','#EFEAD8','#22335F','#3C7A4E'];
function needlePts(cx,cy,rf,ang){
  var t=cpt(cx,cy,ang,rf*.62), q=cpt(cx,cy,ang+Math.PI,rf*.62);
  var w1=cpt(cx,cy,ang+Math.PI/2,rf*.085), w2=cpt(cx,cy,ang-Math.PI/2,rf*.085);
  function f(p){return p[0].toFixed(1)+','+p[1].toFixed(1);}
  return [f(t)+' '+f(w1)+' '+f(w2), f(q)+' '+f(w1)+' '+f(w2)];
}
function compassSVG(cx,cy,rf,n,face,idc,ang){
  var s='<circle cx="'+cx+'" cy="'+cy+'" r="'+rf+'" fill="'+face+'" stroke="#2E4E9E" stroke-width="'+(rf*.072).toFixed(1)+'"/>';
  s+='<circle cx="'+cx+'" cy="'+cy+'" r="'+(rf*.78).toFixed(1)+'" fill="none" stroke="#C9B98C" stroke-width="1.5"/>';
  var i,p1,p2;
  for(i=0;i<n;i++){
    var a=Math.PI*2*i/n-Math.PI/2;
    p1=cpt(cx,cy,a,rf*.80);p2=cpt(cx,cy,a,rf*.93);
    s+='<line class="tick" data-i="'+i+'" x1="'+p1[0].toFixed(1)+'" y1="'+p1[1].toFixed(1)+'" x2="'+p2[0].toFixed(1)+'" y2="'+p2[1].toFixed(1)+'"/>';
  }
  for(i=0;i<5;i++){
    var b=Math.PI*2*i/5-Math.PI/2, q=cpt(cx,cy,b,rf*.56);
    s+='<circle cx="'+q[0].toFixed(1)+'" cy="'+q[1].toFixed(1)+'" r="'+(rf*.10).toFixed(1)+'" fill="'+ELEM[i]+'"'+(i===2?' stroke="#B9A97C" stroke-width="1.5"':'')+'/>';
  }
  var np=needlePts(cx,cy,rf,ang);
  s+='<polygon id="'+idc+'A" points="'+np[0]+'" fill="#E8A93C"/><polygon id="'+idc+'B" points="'+np[1]+'" fill="#B97F1C"/>';
  s+='<circle cx="'+cx+'" cy="'+cy+'" r="'+(rf*.11).toFixed(1)+'" fill="#2E4E9E"/><circle cx="'+cx+'" cy="'+cy+'" r="'+(rf*.045).toFixed(1)+'" fill="#FBF4DE"/>';
  return s;
}
function buildBloom(){
  document.getElementById('bloom').innerHTML=compassSVG(150,78,64,Q.length,'rgba(251,244,222,.94)','nd',-Math.PI/2);
}
function litBloom(count,final){
  document.querySelectorAll('#bloom .tick').forEach(function(t){
    t.classList.toggle('on',+t.dataset.i<count);
  });
  var np=needlePts(150,78,64,-Math.PI/2+Math.PI*2*(count/Q.length));
  var A=document.getElementById('ndA'),B=document.getElementById('ndB');
  if(A)A.setAttribute('points',np[0]);
  if(B)B.setAttribute('points',np[1]);
  document.getElementById('bloomCount').textContent=Math.min(count,Q.length)+' / '+Q.length+' 눈금';
}
function heroCompassHTML(){
  return '<svg class="heroFlower" viewBox="0 0 220 220" aria-hidden="true">'+
    compassSVG(110,110,96,8,'rgba(251,244,222,.60)','hnd',-1.19).replace(/class="tick"/g,'class="tick on"')+
    '</svg>';
}

/* ================= 헬퍼 ================= */
function esc(s){return (s||'').replace(/[&<>"]/g,function(m){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]})}
function toast(msg){
  var t=document.getElementById('toast');t.textContent=msg;
  t.classList.add('show');setTimeout(function(){t.classList.remove('show')},2200);
}
function show(html){
  var old=stage.querySelector('.screen');
  function go(){stage.innerHTML='<div class="screen">'+html+'</div>';window.scrollTo({top:0});}
  if(old){old.classList.add('leaving');setTimeout(go,200);}else go();
}

/* ================= 화면 ================= */
function renderStart(){
  bloomBox.style.display='none';
  show(
    '<div style="text-align:center">'+
    heroCompassHTML()+
    '<div class="hero-badge"><i></i>사주 × 심리 접수 카드</div>'+
    '<div class="big-title">소요유<span class="hanja">逍 遙 遊</span></div>'+
    '<p class="subtitle">領域展開 — 유쾌한 나침반</p>'+
    '<p class="sub" style="margin-top:14px">운명은 정해진 길이 아니라, 그 위에서 자유롭게 노니는 바다.<br>16개의 질문에 답할 때마다 나침반에 눈금이 하나씩 새겨지고,<br>마지막엔 당신만의 방위가 완성됩니다.</p>'+
    '<div class="meaning">'+
    '<div class="mrow"><b>逍遙遊<i>소요유</i></b><p>노닐 소(逍) · 멀 요(遙) · 놀 유(遊). 장자(莊子)의 첫 편 이름으로, 소요(逍遙)는 한가로이 거닒 — 무엇에도 매이지 않고 자유롭게 노닌다는 뜻입니다. 운명을 정해진 길이 아니라 그 위에서 노니는 바다로 읽는, 이 상담의 철학입니다.</p></div>'+
    '<div class="mrow"><b>領域展開<i>日 료이키텐카이(りょういきてんかい) · 韓 영역전개</i></b><p>거느릴 령(領) · 지경 역(域) · 펼 전(展) · 열 개(開) — 나만의 세계를 펼쳐 보인다는 뜻. 열여섯 개의 질문에 답하는 동안, 당신만의 영역이 이 화면 위에 펼쳐집니다.</p></div>'+
    '<div class="mrow"><b>自由<i>日 지유(じゆう) · 韓 자유</i></b><p>스스로 자(自) · 말미암을 유(由) — 모든 것이 나로부터 말미암는다는 뜻. 사주는 답을 정해주지 않습니다. 풀이의 끝은 언제나, 스스로 선택하는 자유입니다.</p></div>'+
    '</div>'+
    '</div>'+
    '<div class="modeCards">'+
      '<button class="modeCard" data-act="mode">'+
        '<span class="ic">🧭</span>'+
        '<span><b>나의 방위 읽기</b><span>16개의 눈금 · 약 12분 · 천천히, 솔직하게</span></span>'+
        '<span class="go">→</span>'+
      '</button>'+
    '</div>'+
    '<div class="signature">— 송이 作 🧭</div>'
  );
}

function renderConsent(){
  show(
    '<div class="qnum">BEFORE WE BEGIN</div>'+
    '<h1>시작하기 전,<br>세 가지 약속</h1>'+
    '<div class="body">'+
      '<div class="consentBox">'+
        '· 여기 적는 내용(생년월일시 포함)은 <b>상담 참고 자료</b>로만 쓰입니다.<br>'+
        '· 사주 풀이는 미래의 확정이 아니라 <b>타고난 기질과 흐름을 읽는 참고 틀</b>입니다. 심리 문항과 함께 종합하며, 결정은 언제나 본인의 몫입니다.<br>'+
        '· 이 접수는 <b>심리상담이나 의료를 대체하지 않습니다.</b> 마음의 어려움이 크게 느껴지는 시기라면, 풀이와 별개로 전문기관의 도움을 함께 받으시길 권합니다.<br>'+
        '· 기록 삭제는 언제든 요청하실 수 있습니다.'+
      '</div>'+
      '<div class="agree" id="agreeRow" data-act="agree" tabindex="0" role="checkbox" aria-checked="false">'+
        '<span class="box"><svg width="14" height="11" viewBox="0 0 14 11" fill="none"><path d="M1 5.5L5 9.5L13 1.5" stroke="#FFF9E8" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span>'+
        '<p>이해했고, 동의합니다. 나의 화첩을 그리러 갑니다.</p>'+
      '</div>'+
      '<div class="nav">'+
        '<button class="btn ghost" data-act="home">←</button>'+
        '<button class="btn primary" id="consentGo" data-act="next" disabled>첫 눈금 새기기 🧭</button>'+
      '</div>'+
    '</div>'
  );
}

function chipBtn(qid,opt,sel,ordIdx){
  return '<button type="button" class="chip'+(sel?' sel':'')+'" data-act="chip" data-q="'+qid+'" data-arg="'+esc(opt)+'">'+opt+
    (ordIdx>-1?'<span class="ord">'+(ordIdx+1)+'</span>':'')+'</button>';
}
function segRow(field,opts,cur){
  return '<div class="chips">'+opts.map(function(o){
    return '<button type="button" class="chip'+(cur===o?' sel':'')+'" data-act="bseg" data-field="'+field+'" data-arg="'+o+'">'+o+'</button>';
  }).join('')+'</div>';
}

function inputHTML(q){
  var v=ans[q.id];
  if(q.type==='text')
    return '<input type="text" id="f0" placeholder="'+esc(q.ph||'')+'" value="'+esc(v||'')+'" autocomplete="off">';
  if(q.type==='textarea')
    return '<textarea id="f0" placeholder="'+esc(q.ph||'')+'">'+esc(v||'')+'</textarea>';
  if(q.type==='birth'){
    var b=v||{};
    return '<div class="stack">'+
      '<div><span class="lbl">생년월일</span><input type="date" id="bd" value="'+esc(b.date||'')+'"></div>'+
      '<div><span class="lbl">양력 / 음력</span>'+segRow('cal',['양력','음력'],b.cal||'양력')+'</div>'+
      '<div><span class="lbl">태어난 시간 · 꼭 적어주세요 ⏰</span><input type="time" id="bt" value="'+esc(b.time||'')+'"></div>'+
      '<div><span class="lbl">그 시간의 확실성은?</span>'+segRow('cert',['정확해요','±1시간쯤','대충 이 정도'],b.cert||'')+'</div>'+
      '<div><span class="lbl">태어난 도시</span><input type="text" id="bc" value="'+esc(b.city||'')+'" placeholder="예: 인천" autocomplete="off"></div>'+
      '<div><span class="lbl">성별</span>'+segRow('sex',['여','남'],b.sex||'')+'</div>'+
    '</div>';
  }
  if(q.type==='chips'){
    var sel=v||[];
    return '<div class="chips">'+q.opts.map(function(o){return chipBtn(q.id,o,sel.indexOf(o)>-1,-1);}).join('')+'</div>';
  }
  if(q.type==='single'){
    return '<div class="chips">'+q.opts.map(function(o){
      return '<button type="button" class="chip'+(v===o?' sel':'')+'" data-act="single" data-q="'+q.id+'" data-arg="'+esc(o)+'">'+o+'</button>';
    }).join('')+'</div>';
  }
  if(q.type==='rank'){
    var sr=v||[];
    return '<div class="chips" id="rankBox">'+q.opts.map(function(o){
      var n=sr.indexOf(o);return chipBtn(q.id,o,n>-1,n);
    }).join('')+'</div>';
  }
  if(q.type==='scale'){
    var sv=v||{};
    return '<div class="scaleHint"><span>1 = 많이 부족함</span><span>5 = 충분함</span></div>'+
      q.rows.map(function(r){
        return '<div class="scaleRow"><span class="rlbl">'+r+'</span><span class="dots">'+
          [1,2,3,4,5].map(function(n){
            return '<button type="button" class="sdot'+(sv[r]===n?' sel':'')+'" data-act="scale" data-q="'+q.id+'" data-row="'+esc(r)+'" data-arg="'+n+'">'+n+'</button>';
          }).join('')+'</span></div>';
      }).join('');
  }
  return '';
}

function renderQ(){
  bloomBox.style.display='block';
  litBloom(idx,false);
  var q=Q[idx];
  show(
    '<div class="qnum">方位 '+String(idx+1).padStart(2,'0')+' / '+String(Q.length).padStart(2,'0')+'</div>'+
    '<h1>'+q.t+'</h1>'+
    (q.s?'<p class="sub">'+q.s+'</p>':'')+
    '<div class="body">'+
      '<div id="qbody">'+inputHTML(q)+'</div>'+
      '<p class="err" id="err">'+(q.type==='birth'?'날짜·시간·확실성·성별까지 모두 채워야 눈금이 새겨져요 ⏰':q.type==='scale'?'다섯 영역 모두 점수를 골라주세요 🧭':'답을 남겨야 다음 눈금이 새겨져요 🧭')+'</p>'+
      '<div class="nav">'+
        '<button class="btn ghost" data-act="prev"'+(idx===0?' style="visibility:hidden"':'')+'>←</button>'+
        '<button class="btn primary" data-act="next">'+(idx===Q.length-1?'나침반 완성하기 🧭':'다음 눈금 →')+'</button>'+
      '</div>'+
      (q.opt?'<div class="skip"><button data-act="skip">이 질문은 건너뛸게요</button></div>':'')+
    '</div>'
  );
}

/* ---- 수집·검증 ---- */
function saveBirth(){
  var qid=Q[idx].id;
  ans[qid]=ans[qid]||{cal:'양력'};
  var bd=document.getElementById('bd'),bt=document.getElementById('bt'),bc=document.getElementById('bc');
  if(bd)ans[qid].date=bd.value;
  if(bt)ans[qid].time=bt.value;
  if(bc)ans[qid].city=bc.value.trim();
}
function collect(){
  var q=Q[idx];if(!q)return;
  var f0=document.getElementById('f0');
  if((q.type==='text'||q.type==='textarea')&&f0)ans[q.id]=f0.value.trim();
  if(q.type==='birth')saveBirth();
}
function valid(){
  var q=Q[idx];if(!q.req)return true;
  var v=ans[q.id];
  if(q.type==='birth')return v&&v.date&&v.time&&v.cert&&v.sex;
  if(q.type==='chips')return v&&v.length>0;
  if(q.type==='single')return !!v;
  if(q.type==='rank')return v&&v.length>=3;
  if(q.type==='scale'){if(!v)return false;
    for(var i=0;i<q.rows.length;i++){if(!v[q.rows[i]])return false;}return true;}
  return v&&v.length>0;
}

/* ---- 요약 카드 ---- */
function strip(s){return (s||'').replace(/^\S+\s/,'')}
function summary(){
  var b=ans.birth||{}, L=[], sv=ans.lifescale||{};
  L.push('━━━━━━━━━━━━━━━━━━━━━');
  L.push('🧭 소요유(逍遙遊) 접수 카드 [사주×심리]');
  L.push('작성일: '+new Date().toLocaleDateString('ko-KR'));
  L.push('━━━━━━━━━━━━━━━━━━━━━');
  L.push('');
  L.push('■ 기본 정보');
  L.push('- 호칭: '+(ans.name||'-'));
  L.push('');
  L.push('■ 명리 정보');
  L.push('- 생년월일: '+(b.date||'-')+' ('+(b.cal||'양력')+')');
  L.push('- 출생 시간: '+(b.time||'-')+' / 확실성: '+(b.cert||'-'));
  L.push('- 출생 도시: '+(b.city||'-')+' / 성별: '+(b.sex||'-'));
  L.push('- 굵직한 변화의 해: '+(ans.events||'-'));
  L.push('');
  L.push('■ 현재 상태');
  L.push('- 영역별 만족도(1~5): '+['일·직업','관계','몸·건강','재정','마음 컨디션'].map(function(r){return r+' '+(sv[r]||'-')}).join(' / '));
  L.push('- 주 호소 고민: '+(ans.concern||'-'));
  L.push('- 스트레스 신호: '+((ans.stress||[]).map(strip).join(', ')||'-'));
  L.push('- 대처 방식: '+((ans.cope||[]).map(strip).join(', ')||'-'));
  L.push('');
  L.push('■ 기질 단서');
  L.push('- 에너지 충전: '+strip(ans.temper1||'-'));
  L.push('- 결정 스타일: '+strip(ans.temper2||'-'));
  L.push('- 변화 대응: '+strip(ans.temper3||'-'));
  L.push('');
  L.push('■ 관계와 패턴');
  L.push('- 관계에서 반복되는 어려움: '+(ans.relation||'-'));
  L.push('- 인생에서 반복되는 패턴: '+(ans.pattern||'-'));
  L.push('- 지지 자원: '+(ans.support||'-'));
  L.push('');
  L.push('■ 가치와 목표');
  L.push('- 삶의 가치 순위: '+((ans.values||[]).map(function(x,i){return (i+1)+'.'+strip(x)}).join(' → ')||'-'));
  L.push('- 들여다볼 영역: '+((ans.wantArea||[]).map(strip).join(', ')||'-'));
  L.push('- 꼭 답을 얻고 싶은 질문: '+(ans.want||'-'));
  L.push('');
  L.push('※ 명리 해석은 기질·흐름의 참고 자료이며 미래를 확정하지 않음.');
  L.push('※ 심리 문항과 함께 종합하며, 결정은 본인이 함. 심리상담·의료의 대체가 아님.');
  return L.join('\n');
}

function renderDone(){
  litBloom(Q.length,true);
  var name=ans.name||'당신';
  document.getElementById('bloomName').textContent=name+'의 나침반';
  show(
    '<div class="doneFlower">🧭</div>'+
    '<h1 style="text-align:center;margin-top:10px"><em>'+esc(name)+'</em>의 나침반이<br>완성되었습니다.</h1>'+
    '<p class="sub" style="text-align:center">이 카드가 풀이의 밑그림이 됩니다.</p>'+
    '<div class="summary">'+esc(summary())+'</div>'+
    '<div class="nav">'+
      '<button class="btn gold" data-act="copy">📋 복사하기</button>'+
      '<button class="btn cloud" data-act="sheet">☁️ 시트로 보내기</button>'+
    '</div>'+
    '<div class="skip"><button data-act="home">처음으로 돌아가기</button></div>'
  );
}

/* ---- 동작 (이벤트 위임) ---- */
var ACT={
  mode:function(){ans={};agreed=false;idx=-1;buildBloom();renderConsent();},
  home:function(){renderStart();},
  agree:function(_,el){
    agreed=!agreed;el.classList.toggle('on',agreed);
    el.setAttribute('aria-checked',agreed);
    var g=document.getElementById('consentGo');if(g)g.disabled=!agreed;
  },
  next:function(){
    if(idx>=0){collect();
      if(!valid()){var e=document.getElementById('err');if(e)e.style.display='block';return;}
    }
    idx++;
    if(idx>=Q.length){renderDone();return;}
    renderQ();
  },
  prev:function(){if(idx>0){collect();idx--;renderQ();}},
  skip:function(){ans[Q[idx].id]='';idx++;
    if(idx>=Q.length){renderDone();return;}renderQ();},
  chip:function(arg,el){
    var qid=el.dataset.q, q=Q[idx];
    ans[qid]=ans[qid]||[];
    var i=ans[qid].indexOf(arg);
    if(q.type==='rank'){
      if(i>-1)ans[qid].splice(i,1);else ans[qid].push(arg);
      var box=document.getElementById('rankBox');
      if(box)box.innerHTML=q.opts.map(function(o){
        var n=ans[qid].indexOf(o);return chipBtn(qid,o,n>-1,n);
      }).join('');
    }else{
      if(i>-1){ans[qid].splice(i,1);el.classList.remove('sel');}
      else{ans[qid].push(arg);el.classList.add('sel');}
    }
  },
  single:function(arg,el){
    ans[el.dataset.q]=arg;
    el.parentNode.querySelectorAll('.chip').forEach(function(c){c.classList.remove('sel')});
    el.classList.add('sel');
  },
  scale:function(arg,el){
    var qid=el.dataset.q,row=el.dataset.row;
    ans[qid]=ans[qid]||{};
    ans[qid][row]=+arg;
    el.parentNode.querySelectorAll('.sdot').forEach(function(d){d.classList.remove('sel')});
    el.classList.add('sel');
  },
  bseg:function(arg,el){
    saveBirth();
    ans[Q[idx].id][el.dataset.field]=arg;
    document.getElementById('qbody').innerHTML=inputHTML(Q[idx]);
  },
  copy:function(){
    var txt=summary();
    function fallback(){
      var ta=document.createElement('textarea');ta.value=txt;
      ta.style.position='fixed';ta.style.opacity='0';
      document.body.appendChild(ta);ta.focus();ta.select();
      try{document.execCommand('copy');toast('복사됐어요 ✓');}
      catch(e){toast('길게 눌러 직접 복사해 주세요');}
      document.body.removeChild(ta);
    }
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(function(){toast('복사됐어요 ✓')}).catch(fallback);
    }else fallback();
  },
  sheet:function(){
    if(!SHEET_URL){toast('아직 시트 주소가 설정되지 않았어요');return;}
    var b=ans.birth||{};
    var payload={
      mode:'개인(사주×심리)',
      name:ans.name||'-',
      birthDate:b.date||'', birthCal:b.cal||'양력', birthTime:b.time||'',
      birthCert:b.cert||'', birthCity:b.city||'', sex:b.sex||'',
      summary:summary()
    };
    fetch(SHEET_URL,{method:'POST',mode:'no-cors',
      headers:{'Content-Type':'text/plain'},
      body:JSON.stringify(payload)})
    .then(function(){toast('시트로 보냈어요 ☁️✓');})
    .catch(function(){toast('전송 실패 — 인터넷 연결을 확인해 주세요');});
  }
};

document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]');
  if(!el||el.disabled)return;
  var fn=ACT[el.dataset.act];
  if(fn)fn(el.dataset.arg,el);
});
document.addEventListener('keydown',function(e){
  var el=e.target;
  if(el.id==='agreeRow'&&(e.key===' '||e.key==='Enter')){e.preventDefault();ACT.agree(null,el);}
  if(e.key==='Enter'&&el.tagName==='INPUT'&&el.type==='text'){e.preventDefault();ACT.next();}
});

renderStart();
</script>
</body>
</html>
